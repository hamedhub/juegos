<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypackel Games - Biblioteca de Juegos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="logo">🎮 HYPACKEL</h1>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Buscar juegos..." class="search-input">
                    <button class="search-btn">🔍</button>
                </div>
            </div>
            <nav class="categories">
                <button class="category-btn active" data-category="all">Todos</button>
                <button class="category-btn" data-category="action">Acción</button>
                <button class="category-btn" data-category="puzzle">Puzzle</button>
                <button class="category-btn" data-category="sports">Deportes</button>
                <button class="category-btn" data-category="racing">Carreras</button>
                <button class="category-btn" data-category="io">IO Games</button>
                <button class="category-btn" data-category="classic">Clásicos</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div id="gamesGrid" class="games-library"></div>

        <div id="noResults" class="no-results" style="display: none;">
            <p>😕 No se encontraron juegos con ese nombre</p>
        </div>
    </main>

    <!-- Game Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-btn" onclick="closeGame()">&times;</button>
            </div>
            <div class="modal-body">
                <iframe id="gameFrame" allowfullscreen></iframe>
            </div>
            <div class="modal-footer">
                <button onclick="fullscreenGame()" class="fullscreen-btn">⛶ Pantalla Completa</button>
                <button onclick="closeGame()" class="close-game-btn">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Hypackel Games - Biblioteca de juegos gratuitos • Todos los juegos pertenecen a sus respectivos creadores</p>
        </div>
    </footer>

    <script src="library.js"></script>
</body>
</html>

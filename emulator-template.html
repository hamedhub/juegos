<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME_TITLE - Hypackel Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        .loading {
            color: #fff;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }
        .controls-info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading">Cargando GAME_TITLE...</div>
        <div id="game"></div>
    </div>

    <div class="controls-info">
        🎮 Controles: Flechas = Mover | Z/X = A/B | Enter = Start | Shift = Select | ESC = Menú
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'CORE_TYPE'; // snes, genesis, nes, gba, etc.
        EJS_gameUrl = 'ROM_PATH'; // Path to ROM file
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        EJS_startOnLoaded = true;
        EJS_biosUrl = '';
        EJS_gameID = 'GAME_ID';

        // Custom colors
        EJS_color = '#e94560';
        EJS_backgroundColor = '#0a0a0a';

        // Volume
        EJS_volume = 0.5;

        // Options
        EJS_VirtualGamepadSettings = {
            joystickSize: 100,
            buttonSize: 60,
            opacity: 0.7
        };
    </script>

    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>
</body>
</html>

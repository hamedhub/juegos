<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #gameCanvas {
            border: 3px solid #43e97b;
            box-shadow: 0 0 20px rgba(67, 233, 123, 0.5);
        }
        #score {
            font-size: 24px;
            margin-bottom: 20px;
            color: #43e97b;
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #43e97b;
        }
        #gameOver h1 {
            color: #ff4757;
            margin-bottom: 20px;
        }
        button {
            background: #43e97b;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #38f9d7;
        }
    </style>
</head>
<body>
    <div id="score">Puntuación: 0</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="gameOver">
        <h1>Game Over!</h1>
        <p id="finalScore"></p>
        <button onclick="location.reload()">Jugar de Nuevo</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = true;

        document.addEventListener('keydown', changeDirection);

        function changeDirection(e) {
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const W = 87, A = 65, S = 83, D = 68;

            const keyPressed = e.keyCode;

            if ((keyPressed === LEFT || keyPressed === A) && dx === 0) {
                dx = -1; dy = 0;
            }
            if ((keyPressed === UP || keyPressed === W) && dy === 0) {
                dx = 0; dy = -1;
            }
            if ((keyPressed === RIGHT || keyPressed === D) && dx === 0) {
                dx = 1; dy = 0;
            }
            if ((keyPressed === DOWN || keyPressed === S) && dy === 0) {
                dx = 0; dy = 1;
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            setTimeout(() => {
                clearCanvas();
                moveSnake();
                drawSnake();
                drawFood();
                checkCollision();
                gameLoop();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function moveSnake() {
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = 'Puntuación: ' + score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function drawSnake() {
            ctx.fillStyle = '#43e97b';
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#38f9d7';
                } else {
                    ctx.fillStyle = '#43e97b';
                }
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });
        }

        function drawFood() {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn on snake
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                }
            });
        }

        function checkCollision() {
            const head = snake[0];

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameRunning = false;
            finalScoreElement.textContent = 'Puntuación Final: ' + score;
            gameOverElement.style.display = 'block';
        }

        gameLoop();
    </script>
</body>
</html>
